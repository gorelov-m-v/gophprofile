apiVersion: batch/v1
kind: Job
metadata:
  name: gophprofile-migrate
  namespace: gophprofile
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: gophprofile
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: gophprofile
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gophprofile
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: gorelov-m-v/gophprofile:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/migrate"]
          env:
            - name: SERVICE_NAME
              value: gophprofile-migrate
          envFrom:
            - configMapRef:
                name: gophprofile-config
            - secretRef:
                name: gophprofile-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
