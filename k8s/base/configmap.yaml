apiVersion: v1
kind: ConfigMap
metadata:
  name: gophprofile-config
  namespace: gophprofile
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/part-of: gophprofile
data:
  SERVER_ADDR: ":8080"
  METRICS_ADDR: ":9091"
  MIGRATIONS_PATH: /app/migrations
  RUN_MIGRATIONS: "false"
  WEB_DIR: /app/web/static
  MAX_UPLOAD_SIZE: "10485760"
  S3_ENDPOINT: minio:9000
  S3_BUCKET: avatars
  S3_USE_SSL: "false"
  S3_PUBLIC_URL: http://minio:9000/avatars
  RABBITMQ_EXCHANGE: avatars.exchange
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
  LOG_LEVEL: info
