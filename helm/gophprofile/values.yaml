nameOverride: ""
fullnameOverride: ""

image:
  repository: gorelov-m-v/gophprofile
  tag: latest
  pullPolicy: IfNotPresent

config:
  serverAddr: ":8080"
  metricsAddr: ":9091"
  migrationsPath: /app/migrations
  webDir: /app/web/static
  maxUploadSize: "10485760"
  s3Endpoint: minio:9000
  s3Bucket: avatars
  s3UseSSL: "false"
  s3PublicURL: http://minio:9000/avatars
  rabbitmqExchange: avatars.exchange
  otelEndpoint: otel-collector:4317
  logLevel: info

secret:
  create: true
  name: ""
  databaseUrl: postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
  s3AccessKey: minioadmin
  s3SecretKey: minioadmin
  rabbitmqUrl: amqp://guest:guest@rabbitmq:5672/

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

rbac:
  create: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

server:
  replicas: 2
  port: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

worker:
  replicas: 2
  metricsPort: 9091
  service:
    type: ClusterIP
    port: 9091
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

migration:
  enabled: true
  hook: true
  backoffLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: gophprofile.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceMonitor:
  enabled: true
  interval: 30s
  labels: {}

networkPolicy:
  enabled: true
  ingressNamespaceNames:
    - ingress-nginx
    - monitoring
  egressPorts:
    - 80
    - 443
    - 5432
    - 5672
    - 9000
    - 4317

podDisruptionBudget:
  enabled: true
  server:
    minAvailable: 1
  worker:
    minAvailable: 1
