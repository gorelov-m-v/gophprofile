apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophprofile.fullname" . }}-worker
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: gophprofile
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
    spec:
      serviceAccountName: {{ include "gophprofile.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/worker
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: {{ printf "%s-worker" (include "gophprofile.fullname" .) | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "gophprofile.fullname" . }}-config
            - secretRef:
                name: {{ include "gophprofile.secretName" . }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            {{- toYaml .Values.worker.startupProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            {{- toYaml .Values.worker.readinessProbe | nindent 12 }}
