server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gophprofile
    static_configs:
      - targets: ["localhost"]
        labels:
          job: gophprofile
          service: gophprofile-server
          __path__: /var/log/gophprofile/server.log
      - targets: ["localhost"]
        labels:
          job: gophprofile
          service: gophprofile-worker
          __path__: /var/log/gophprofile/worker.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            service: service
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          service:
          trace_id:
